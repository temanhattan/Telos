version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default set
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Security
    - gosec
    # Style & correctness
    - misspell
    - unconvert
    - gocritic
    - revive
    # Bug detection
    - bodyclose
    - nilerr

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment  # Noisy for domain model structs; address via benchmarks later
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
      - name: blank-imports
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
  gosec:
    excludes:
      - G404  # Weak random — not applicable; crypto uses crypto/rand
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

issues:
  exclude-rules:
    # Test files can be more relaxed
    - path: _test\.go
      linters:
        - gosec
        - gocritic
        - revive

    # The placeholder core package is acknowledged tech debt (TD-1)
    - path: core/some_subsystem\.go
      linters:
        - revive

  max-issues-per-linter: 50
  max-same-issues: 10
